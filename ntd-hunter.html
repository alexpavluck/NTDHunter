<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sightsavers NTD Hunter</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#04020d;overflow:hidden}
  canvas{position:fixed;top:0;left:0;display:block;cursor:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";
/* ============================================================
   SIGHTSAVERS NTD HUNTER — voxel vector-control arena shooter
   Geometry Wars-inspired: reactive grid, neon bloom, voxel ship
   WASD move · mouse aim · hold click to fire · SPACE dash
   P pause · M mute · R restart
   ============================================================ */

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  const de = document.documentElement;
  // window.innerWidth/Height can be 0 in freshly-laid-out embeds; fall back hard.
  W = window.innerWidth || (de && de.clientWidth) || (document.body && document.body.clientWidth) || 800;
  H = window.innerHeight || (de && de.clientHeight) || (document.body && document.body.clientHeight) || 600;
  W = Math.max(W, 320); H = Math.max(H, 240);
  cv.width = W * DPR; cv.height = H * DPR;
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
}
window.addEventListener('resize', resize);
window.addEventListener('load', resize);
window.addEventListener('orientationchange', resize);
// ResizeObserver catches embeds/iframes that settle their size without firing a window 'resize'
try { if (window.ResizeObserver) new ResizeObserver(resize).observe(document.documentElement); } catch(e){}
resize();

/* ---------------- helpers ---------------- */
const TAU = Math.PI * 2;
const clamp = (v,a,b)=> v<a?a:(v>b?b:v);
const lerp = (a,b,t)=> a+(b-a)*t;
const rand = (a,b)=> a + Math.random()*(b-a);
const dist2 = (ax,ay,bx,by)=>{const dx=ax-bx,dy=ay-by;return dx*dx+dy*dy;};
function hash2(x,y){ const s = Math.sin(x*127.1 + y*311.7)*43758.5453; return s - Math.floor(s); }
function hex(c){ return [parseInt(c.slice(1,3),16), parseInt(c.slice(3,5),16), parseInt(c.slice(5,7),16)]; }
function shade(rgb, f){
  const r = clamp(rgb[0]*f,0,255)|0, g = clamp(rgb[1]*f,0,255)|0, b = clamp(rgb[2]*f,0,255)|0;
  return 'rgb('+r+','+g+','+b+')';
}

/* ---------------- neon palette ---------------- */
const PAL = {
  ivory:   hex('#f4f8ff'), cyan: hex('#35e6ff'), steel: hex('#3a3f66'),
  gold:    hex('#ffe14d'), ember: hex('#ff7a2e'),
  chaser:  hex('#41a8ff'),   // blue seekers
  sprinter:hex('#4dff6e'),   // green dashers
  brute:   hex('#b44dff'),   // purple heavies
  spitter: hex('#ff9e2e'),   // orange artillery
  orb:     hex('#ff4dd2'),   // pink shots
  heart:   hex('#ff4d6e'),
  wall:    hex('#181341'),
};
const GLOWC = {
  chaser:'#41a8ff', sprinter:'#4dff6e', brute:'#b44dff', spitter:'#ff9e2e',
};

/* ---------------- audio (tiny synth) ---------------- */
let AC = null, master = null, muted = false;
function audioInit(){
  if (AC) return;
  try{
    AC = new (window.AudioContext||window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = 0.22; master.connect(AC.destination);
  }catch(e){ AC = null; }
}
function tone(type, f0, f1, dur, vol, curve){
  if (!AC || muted) return;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; const t = AC.currentTime;
  o.frequency.setValueAtTime(f0, t);
  if (curve === 'exp') o.frequency.exponentialRampToValueAtTime(Math.max(f1,1), t+dur);
  else o.frequency.linearRampToValueAtTime(f1, t+dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+0.02);
}
let noiseBuf = null;
function noise(dur, vol, f0, f1){
  if (!AC || muted) return;
  if (!noiseBuf){
    noiseBuf = AC.createBuffer(1, AC.sampleRate*0.5, AC.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i=0;i<d.length;i++) d[i] = Math.random()*2-1;
  }
  const s = AC.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
  const fl = AC.createBiquadFilter(); fl.type = 'lowpass';
  const g = AC.createGain(); const t = AC.currentTime;
  fl.frequency.setValueAtTime(f0, t); fl.frequency.exponentialRampToValueAtTime(Math.max(f1,40), t+dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  s.connect(fl); fl.connect(g); g.connect(master); s.start(t); s.stop(t+dur+0.02);
}
const SFX = {
  shoot(){ tone('square', 880, 240, 0.07, 0.13, 'exp'); },
  hit(){ noise(0.06, 0.18, 2600, 700); },
  explode(big){ noise(big?0.4:0.22, big?0.5:0.3, big?1800:2400, 120); tone('sine', big?120:170, 40, big?0.35:0.2, 0.4, 'exp'); },
  dash(){ noise(0.16, 0.2, 500, 4200); },
  hurt(){ tone('sawtooth', 220, 60, 0.3, 0.35, 'exp'); noise(0.18, 0.25, 1200, 200); },
  pickup(){ tone('sine', 520, 1040, 0.12, 0.2); tone('sine', 780, 1560, 0.16, 0.14); },
  wave(){ tone('triangle', 392, 392, 0.12, 0.22); setTimeout(()=>tone('triangle', 587, 587, 0.2, 0.22), 130); },
  pop(){ tone('square', 980, 1400, 0.06, 0.1); },
  over(){ tone('sawtooth', 200, 50, 1.1, 0.3, 'exp'); noise(0.9, 0.3, 900, 60); },
};

/* ---------------- input ---------------- */
const keys = {};
let mouseX = W/2, mouseY = H/2, mouseDown = false;
window.addEventListener('keydown', e=>{
  keys[e.code] = true;
  if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
  if (e.code === 'KeyM') muted = !muted;
  if (e.code === 'KeyP' && state==='playing') paused = !paused;
  if (e.code === 'KeyR' && state==='over') startGame();
  if (e.code === 'Space'){
    if (state==='menu') startGame();
    else if (state==='over' && overT > 1.2) startGame();
  }
});
window.addEventListener('keyup', e=>{ keys[e.code] = false; });
cv.addEventListener('mousemove', e=>{ mouseX = e.clientX; mouseY = e.clientY; });
cv.addEventListener('mousedown', e=>{
  audioInit();
  if (state === 'menu') { startGame(); return; }
  if (state === 'over') { if (overT > 1.2) startGame(); return; }
  mouseDown = true;
});
window.addEventListener('mouseup', ()=>{ mouseDown = false; });
cv.addEventListener('contextmenu', e=>e.preventDefault());

/* ---------------- world ---------------- */
const ARENA = 1700;
const GRID = 44;          // grid cell size
const BOUND = 56;

let state = 'menu';
let paused = false;
let camX = ARENA/2, camY = ARENA/2;
let shake = 0, shakeX = 0, shakeY = 0;
let hitstop = 0, timeScale = 1, overT = 0;
let elapsed = 0;

let player, enemies, bullets, orbs, parts, lights, floats, pickups, spawnsQ, dust, ripples, jets;
let score, best = 0, kills, wave, waveBreak, waveBanner, combo, comboT, dmgFlash;
try { best = parseInt(localStorage.getItem('ntdhunter_best')||'0',10)||0; } catch(e){}

function startGame(){
  audioInit();
  state = 'playing'; paused = false; overT = 0; timeScale = 1;
  player = {
    x: ARENA/2, y: ARENA/2, vx:0, vy:0, r:13, aim:0,
    hp:5, maxHp:5, iframes:0, fireCd:0, walk:0,
    dashT:0, dashCd:0, dashAng:0, trail:[], heartBounce:0,
  };
  enemies = []; bullets = []; orbs = []; parts = []; lights = [];
  floats = []; pickups = []; spawnsQ = []; ripples = []; jets = [];
  score = 0; kills = 0; combo = 0; comboT = 0; dmgFlash = 0;
  wave = 0; waveBreak = 1.6; waveBanner = 0;
  camX = player.x; camY = player.y;
  initDust();
}
function initDust(){
  dust = [];
  for (let i=0;i<80;i++) dust.push({
    x: rand(0,ARENA), y: rand(0,ARENA), z: rand(6,90),
    vx: rand(-6,6), vy: rand(-4,4), s: rand(1,2.4), tw: rand(0,TAU),
    c: ['#35e6ff','#ff4dd2','#b44dff','#f4f8ff'][(Math.random()*4)|0]
  });
}
initDust();
enemies = []; bullets = []; orbs = []; parts = []; lights = [];
floats = []; pickups = []; spawnsQ = [];
ripples = []; jets = [];

/* ---------------- reactive grid ---------------- */
function addRipple(x,y,amp){
  ripples.push({x,y,t:0,amp});
  if (ripples.length > 12) ripples.shift();
}
function gridDisp(x,y){
  let dx=0, dy=0;
  for (let i=0;i<ripples.length;i++){
    const r = ripples[i];
    const ddx = x-r.x, ddy = y-r.y;
    const d = Math.sqrt(ddx*ddx+ddy*ddy)+0.001;
    const w = Math.sin(d*0.055 - r.t*16) * r.amp
            * Math.exp(-d/270) * Math.exp(-r.t*3.2);
    dx += (ddx/d)*w; dy += (ddy/d)*w;
  }
  return [dx,dy];
}

/* ---------------- voxel renderer ---------------- */
let drawQ = [];
function qCube(x,y,z,sx,sy,sz,rgb,light,glow){
  drawQ.push({k: y + sy + z*0.001, x,y,z,sx,sy,sz,rgb,light,glow:glow||0});
}
function renderQ(ox,oy){
  drawQ.sort((a,b)=> a.k - b.k);
  for (let i=0;i<drawQ.length;i++){
    const c = drawQ[i];
    const sx = c.x - ox, syTop = c.y - c.z - c.sz - oy;
    ctx.fillStyle = shade(c.rgb, 1.22 * c.light + c.glow);
    ctx.fillRect(sx, syTop, c.sx, c.sy);
    ctx.fillStyle = shade(c.rgb, 0.6 * c.light + c.glow*0.65);
    ctx.fillRect(sx, syTop + c.sy, c.sx, c.sz);
    ctx.fillStyle = shade(c.rgb, 0.9 * c.light + c.glow*0.85);
    ctx.fillRect(sx + c.sx - Math.max(1.5, c.sx*0.14), syTop, Math.max(1.5, c.sx*0.14), c.sy);
  }
  drawQ.length = 0;
}

function lightAt(x,y){
  let L = 0.85;
  for (let i=0;i<lights.length;i++){
    const l = lights[i];
    const d = Math.sqrt(dist2(x,y,l.x,l.y));
    if (d < l.r) L += l.i * (1 - d/l.r) * (l.ttl===undefined?1:clamp(l.ttl/l.max,0,1));
  }
  return clamp(L, 0.6, 2.1);
}
function addLight(x,y,r,i,col,ttl){
  lights.push({x,y,r,i,col,ttl,max:ttl});
}

/* ---------------- models ---------------- */
function rot(lx,ly,a){ const c=Math.cos(a), s=Math.sin(a); return [lx*c-ly*s, lx*s+ly*c]; }

/* the ship: a voxel claw, GW-style */
const SHIP = [
  // {fwd, side, z, size, color, glow}
  {x: 17, y: 0,   z: 6, s: 6.5, c:'ivory', g:0.55},   // nose tip
  {x: 10, y: 0,   z: 6, s: 8,   c:'ivory', g:0.3 },   // nose
  {x: 2,  y: 0,   z: 8, s: 9,   c:'cyan',  g:0.7 },   // cockpit core
  {x: 1,  y: -8,  z: 5, s: 7,   c:'ivory', g:0.18},   // inner wings
  {x: 1,  y: 8,   z: 5, s: 7,   c:'ivory', g:0.18},
  {x: -6, y: -13, z: 5, s: 6.5, c:'cyan',  g:0.45},   // wing blades
  {x: -6, y: 13,  z: 5, s: 6.5, c:'cyan',  g:0.45},
  {x: -12,y: -17, z: 6, s: 5,   c:'cyan',  g:0.6 },   // claw tips, swept back
  {x: -12,y: 17,  z: 6, s: 5,   c:'cyan',  g:0.6 },
  {x: -8, y: 0,   z: 5, s: 7,   c:'steel', g:0.05},   // tail block
  {x: -14,y: 0,   z: 5, s: 5,   c:'ember', g:0.0 },   // engine (glow set live)
];
function drawShip(p){
  const blink = p.iframes > 0 && (Math.floor(elapsed*22)%2===0);
  if (blink) return;
  const L = lightAt(p.x,p.y);
  const a = p.aim;
  const hover = Math.sin(elapsed*5.2)*1.6;
  const spd = Math.hypot(p.vx,p.vy);
  const thrust = clamp(spd/250,0,1);
  for (const m of SHIP){
    const [wx,wy] = rot(m.x, m.y, a);
    let g = m.g;
    if (m.c === 'ember') g = 0.35 + thrust*0.9 + Math.random()*0.2;
    if (m.c === 'cyan' && m.x === 2 && p.fireCd > 0.07) g += 0.5;
    qCube(p.x+wx - m.s/2, p.y+wy - m.s/2, m.z + hover, m.s, m.s*0.9, m.s, PAL[m.c], L, g);
  }
  // dash afterimages
  for (const t of p.trail){
    const f = t.ttl/0.25;
    for (const m of SHIP){
      if (m.c === 'steel' || m.c === 'ember') continue;
      const [wx,wy] = rot(m.x, m.y, t.a);
      qCube(t.x+wx - m.s/2, t.y+wy - m.s/2, m.z + 4, m.s, m.s*0.9, m.s, PAL.cyan, 0.8, f*0.7);
    }
  }
}
function muzzleWorld(p){
  const a = p.aim;
  return [ p.x + Math.cos(a)*24, p.y + Math.sin(a)*24 ];
}

function drawEnemy(e){
  const L = lightAt(e.x,e.y);
  const fl = e.flash > 0 ? 1.0 : 0;
  const a = Math.atan2(player.y-e.y, player.x-e.x);
  const riseZ = e.rise > 0 ? -e.rise * 40 : 0;
  const riseG = e.rise > 0 ? e.rise * 1.4 : 0;
  const extra = fl + riseG;
  // place a cube at forward/side offset relative to heading `a`
  const F = (fwd,side,z,sx,sy,sz,col,g)=>{
    const [wx,wy] = rot(fwd, side, a);
    qCube(e.x+wx - sx/2, e.y+wy - sy/2, z + riseZ, sx, sy, sz, col, L, g + extra);
  };

  if (e.type === 'chaser'){
    /* BLACKFLY — onchocerciasis (river blindness) vector */
    const wf = Math.sin(e.anim*38) * 3.5;       // wing buzz
    F(-5, 0, 3, 8, 7, 6, PAL.chaser, 0.14);     // abdomen
    F( 1, 0, 4, 7, 7, 7, PAL.chaser, 0.30);     // thorax
    F( 7, 0, 5, 5, 5, 5, hex('#1d2752'), 0.05); // head (dark)
    F( 8.6,-2.4, 6, 3,3,3, PAL.ember, 0.75);    // eyes
    F( 8.6, 2.4, 6, 3,3,3, PAL.ember, 0.75);
    F(-0.5,-8, 9 + wf, 10,4,2, PAL.ivory, 0.32);// wings (buzzing)
    F(-0.5, 8, 9 - wf, 10,4,2, PAL.ivory, 0.32);
  } else if (e.type === 'sprinter'){
    /* MOSQUITO — lymphatic filariasis vector */
    const wf = Math.sin(e.anim*44) * 3;
    F(-7, 0, 3,   6,5,5, PAL.sprinter, 0.12);   // abdomen tip
    F(-3, 0, 3.5, 6,5,5, PAL.sprinter, 0.22);
    F( 1, 0, 4,   5,5,6, PAL.sprinter, 0.30);   // thorax
    F( 5, 0, 4.5, 4,4,4, hex('#2f8f45'), 0.20); // head
    F(10, 0, 4.5, 9,1.7,1.7, PAL.ivory, 0.45);  // proboscis
    F(14.5,0, 4.5, 3,1.5,1.5, PAL.cyan, 0.85);  // needle tip
    F(-1,-7, 8 + wf, 8,2.5,1.5, PAL.ivory, 0.28);// narrow wings
    F(-1, 7, 8 - wf, 8,2.5,1.5, PAL.ivory, 0.28);
    F(-2,-5, 1, 1.5,1.5,3, hex('#206030'), 0.0);// dangling legs
    F(-2, 5, 1, 1.5,1.5,3, hex('#206030'), 0.0);
  } else if (e.type === 'spitter'){
    /* TSETSE FLY — heavy biting fly, lobs larvae */
    const hov = 10 + Math.sin(e.anim*4)*4;
    const wf = Math.sin(e.anim*30) * 1.6;
    F(-4, 0, hov,   9,9,7, PAL.spitter, 0.16);  // fat abdomen
    F( 2, 0, hov+1, 8,8,7, PAL.spitter, 0.28);  // thorax
    F( 7, 0, hov+1, 5,5,5, hex('#7a4a12'), 0.06);// head
    F(-3,-5, hov+5 + wf, 11,4,1.6, hex('#caa36a'), 0.22);// wings folded back
    F(-3, 5, hov+5 - wf, 11,4,1.6, hex('#caa36a'), 0.22);
    const charge = e.cd < 0.5 ? (0.5-e.cd) : 0;
    F(8.6, 0, hov+1, 4,3,3, PAL.orb, 0.4 + charge*1.7);// proboscis (charges pink)
  } else if (e.type === 'brute'){
    /* GUINEA WORM — slow, segmented, armoured helminth */
    let hd = Math.atan2(e.vy, e.vx);
    if (Math.hypot(e.vx,e.vy) < 5) hd = a;
    const HR = (fwd,side)=> rot(fwd, side, hd);
    const headF = 13, spacing = 8, segs = 5;
    // head
    {
      const [hx,hy] = HR(headF, 0);
      qCube(e.x+hx-9, e.y+hy-9, 6+riseZ, 18,17,14, PAL.brute, L, 0.20+extra);
      // mouth (faces player)
      const [mx,my] = rot(headF+4, 0, a);
      qCube(e.x+mx-4, e.y+my-2, 14+riseZ, 8,4,5, PAL.ivory, 1.3, 0.6);
      // eyes
      const [e1x,e1y]=rot(headF+1,-4,a), [e2x,e2y]=rot(headF+1,4,a);
      qCube(e.x+e1x-2,e.y+e1y-2, 18+riseZ,3,3,3, PAL.ember,L,0.6);
      qCube(e.x+e2x-2,e.y+e2y-2, 18+riseZ,3,3,3, PAL.ember,L,0.6);
    }
    // undulating body segments trailing behind the head
    for (let i=1;i<=segs;i++){
      const t = i/segs;
      const wob = Math.sin(e.anim*5 - i*0.95) * (6 * (1 - t*0.4));
      const [sx,sy] = HR(headF - spacing*i, wob);
      const w  = 17 - t*8;
      const sz = 14 - t*6;
      qCube(e.x+sx - w/2, e.y+sy - w*0.46, 5+riseZ, w, w*0.92, sz, PAL.brute, L, 0.13 + fl*0.7 + riseG*0.6);
      qCube(e.x+sx - w/2, e.y+sy - w*0.16, 5+riseZ+sz, w, w*0.30, 3, hex('#e0a8ff'), L, 0.38);
    }
  }
}

function drawPickup(pk){
  const L = lightAt(pk.x,pk.y);
  const z = 10 + Math.sin(pk.t*4)*4;
  const s = 5;
  qCube(pk.x-s, pk.y-2, z+s*0.8, s*0.9, 4, s*0.9, PAL.heart, L, 0.6);
  qCube(pk.x+s*0.1, pk.y-2, z+s*0.8, s*0.9, 4, s*0.9, PAL.heart, L, 0.6);
  qCube(pk.x-s*0.5, pk.y-2, z, s, 4, s*0.9, PAL.heart, L, 0.6);
}

/* ---------------- spawning / waves ---------------- */
const E_DEF = {
  chaser:  { hp:3,  spd:96,  r:12, dmg:1, pts:100 },
  sprinter:{ hp:2,  spd:195, r:9,  dmg:1, pts:150 },
  brute:   { hp:14, spd:46,  r:20, dmg:1, pts:400 },
  spitter: { hp:4,  spd:70,  r:11, dmg:1, pts:250 },
};
function queueSpawn(type, delay){
  let x,y,tries=0;
  do {
    const side = (Math.random()*4)|0;
    if (side===0){ x=rand(BOUND+40,ARENA-BOUND-40); y=BOUND+50; }
    else if (side===1){ x=rand(BOUND+40,ARENA-BOUND-40); y=ARENA-BOUND-50; }
    else if (side===2){ x=BOUND+50; y=rand(BOUND+40,ARENA-BOUND-40); }
    else { x=ARENA-BOUND-50; y=rand(BOUND+40,ARENA-BOUND-40); }
    tries++;
  } while (tries<10 && dist2(x,y,player.x,player.y) < 320*320);
  spawnsQ.push({type, x, y, t: delay, tele: 0.75});
}
function startWave(n){
  wave = n; waveBanner = 2.4;
  SFX.wave();
  const count = 5 + Math.round(n*2.6);
  let delay = 0;
  for (let i=0;i<count;i++){
    let type = 'chaser';
    const r = Math.random();
    if (n>=2 && r<0.3) type='sprinter';
    if (n>=3 && r>=0.3 && r<0.45) type='spitter';
    queueSpawn(type, delay);
    delay += rand(0.25, 0.7);
  }
  const brutes = n>=4 ? 1 + ((n-4)/2|0) : 0;
  for (let i=0;i<brutes;i++) queueSpawn('brute', rand(2, 5));
}

/* ---------------- effects ---------------- */
function debris(x,y,rgb,n,power){
  for (let i=0;i<n;i++){
    if (parts.length > 420) break;
    const a = rand(0,TAU), v = rand(40,220)*power;
    parts.push({
      x,y, z: rand(4,18),
      vx: Math.cos(a)*v, vy: Math.sin(a)*v, vz: rand(120,330)*power,
      s: rand(2.5,6), rgb, ttl: rand(0.6,1.3), max:1.3,
    });
  }
}
function floatText(x,y,txt,col,big){
  floats.push({x,y,txt,col,ttl:1,big:!!big});
}
function killEnemy(e, idx){
  enemies.splice(idx,1);
  kills++;
  combo++; comboT = 2.2;
  const mult = 1 + Math.min(combo,30)*0.1;
  const pts = Math.round(E_DEF[e.type].pts * mult);
  score += pts;
  floatText(e.x, e.y-20, '+'+pts, GLOWC[e.type], e.type==='brute');
  const big = e.type==='brute';
  debris(e.x, e.y, PAL[e.type], big?28:14, big?1.5:1);
  debris(e.x, e.y, PAL.ivory, 4, 0.7);
  addLight(e.x, e.y, big?280:170, big?1.4:0.9, GLOWC[e.type], big?0.5:0.3);
  addRipple(e.x, e.y, big?22:11);
  SFX.explode(big);
  hitstop = Math.max(hitstop, big?0.07:0.035);
  shake = Math.min(shake + (big?9:4), 16);
  if (Math.random() < (player.hp < player.maxHp ? 0.13 : 0.04))
    pickups.push({x:e.x, y:e.y, t:0, ttl:12});
}

/* ---------------- update ---------------- */
function update(dt){
  elapsed += dt;
  for (const d of dust){
    d.x += d.vx*dt; d.y += d.vy*dt; d.tw += dt;
    if (d.x<0) d.x+=ARENA; if (d.x>ARENA) d.x-=ARENA;
    if (d.y<0) d.y+=ARENA; if (d.y>ARENA) d.y-=ARENA;
  }
  for (let i=lights.length-1;i>=0;i--){
    const l = lights[i];
    if (l.ttl !== undefined){ l.ttl -= dt; if (l.ttl<=0) lights.splice(i,1); }
  }
  for (let i=ripples.length-1;i>=0;i--){
    ripples[i].t += dt;
    if (ripples[i].t > 1.4) ripples.splice(i,1);
  }
  for (let i=jets.length-1;i>=0;i--){
    const j = jets[i];
    j.ttl -= dt; j.x += j.vx*dt; j.y += j.vy*dt;
    if (j.ttl<=0) jets.splice(i,1);
  }
  if (state !== 'playing'){
    if (state==='over') overT += dt;
    updateParts(dt);
    return;
  }

  const p = player;
  /* movement */
  let ix = (keys.KeyD||keys.ArrowRight?1:0) - (keys.KeyA||keys.ArrowLeft?1:0);
  let iy = (keys.KeyS||keys.ArrowDown?1:0) - (keys.KeyW||keys.ArrowUp?1:0);
  const il = Math.hypot(ix,iy)||1; ix/=il; iy/=il;
  const SPD = 252;
  if (p.dashT > 0){
    p.dashT -= dt;
    p.vx = Math.cos(p.dashAng)*SPD*3.4;
    p.vy = Math.sin(p.dashAng)*SPD*3.4;
    if (Math.random()<0.85) p.trail.push({x:p.x,y:p.y,a:p.aim,ttl:0.25});
  } else {
    p.vx = lerp(p.vx, ix*SPD, 1-Math.pow(0.0001, dt));
    p.vy = lerp(p.vy, iy*SPD, 1-Math.pow(0.0001, dt));
  }
  p.x = clamp(p.x + p.vx*dt, BOUND, ARENA-BOUND);
  p.y = clamp(p.y + p.vy*dt, BOUND, ARENA-BOUND);
  const spd = Math.hypot(p.vx,p.vy);
  if (spd > 30) p.walk += dt;
  p.dashCd -= dt; p.iframes -= dt; p.fireCd -= dt; p.heartBounce -= dt;
  for (let i=p.trail.length-1;i>=0;i--){ p.trail[i].ttl-=dt; if(p.trail[i].ttl<=0) p.trail.splice(i,1); }

  /* engine exhaust */
  if (spd > 50 && Math.random() < dt*60){
    const ea = p.aim + Math.PI;
    const ex = p.x + Math.cos(ea)*16, ey = p.y + Math.sin(ea)*16;
    jets.push({x:ex, y:ey, vx:Math.cos(ea)*70 - p.vx*0.2, vy:Math.sin(ea)*70 - p.vy*0.2,
               ttl: rand(0.18,0.34), max:0.34});
  }

  if (keys.Space && p.dashCd <= 0 && p.dashT <= 0){
    const mv = Math.hypot(ix,iy)>0.1;
    p.dashAng = mv ? Math.atan2(iy,ix) : p.aim;
    p.dashT = 0.17; p.dashCd = 1.15; p.iframes = Math.max(p.iframes, 0.3);
    addRipple(p.x, p.y, 9);
    SFX.dash(); shake = Math.min(shake+3, 16);
  }

  /* aim & fire */
  const wx = mouseX + camX - W/2 + shakeX, wy = mouseY + camY - H/2 + shakeY;
  p.aim = Math.atan2(wy - p.y, wx - p.x);
  if (mouseDown && p.fireCd <= 0){
    p.fireCd = 0.115;
    const [mx,my] = muzzleWorld(p);
    const spread = rand(-0.045, 0.045);
    const a = p.aim + spread;
    bullets.push({x:mx, y:my, vx:Math.cos(a)*620, vy:Math.sin(a)*620, ttl:0.9});
    addLight(mx, my, 140, 1.0, '#ffe14d', 0.09);
    addRipple(mx, my, 2.6);
    p.vx -= Math.cos(a)*26; p.vy -= Math.sin(a)*26;
    shake = Math.min(shake+0.9, 16);
    SFX.shoot();
  }

  addLight(p.x, p.y, 190, 0.34, '#35e6ff', 0.05);

  /* bullets */
  for (let i=bullets.length-1;i>=0;i--){
    const b = bullets[i];
    b.x += b.vx*dt; b.y += b.vy*dt; b.ttl -= dt;
    let dead = b.ttl<=0 || b.x<BOUND-10 || b.x>ARENA-BOUND+10 || b.y<BOUND-10 || b.y>ARENA-BOUND+10;
    if (!dead) for (let j=enemies.length-1;j>=0;j--){
      const e = enemies[j];
      if (e.rise > 0.4) continue;
      const r = E_DEF[e.type].r + 5;
      if (dist2(b.x,b.y,e.x,e.y) < r*r){
        e.hp -= 1; e.flash = 0.07;
        const kb = e.type==='brute'?38:120;
        e.vx += (b.vx/620)*kb; e.vy += (b.vy/620)*kb;
        debris(b.x, b.y, PAL.gold, 3, 0.5);
        SFX.hit();
        dead = true;
        if (e.hp <= 0) killEnemy(e, j);
        break;
      }
    }
    if (!dead) for (let j=orbs.length-1;j>=0;j--){
      const o = orbs[j];
      if (dist2(b.x,b.y,o.x,o.y) < 13*13){
        orbs.splice(j,1); dead = true;
        score += 25; floatText(o.x,o.y,'+25','#ff9ee6');
        debris(o.x,o.y,PAL.orb,6,0.7); addRipple(o.x,o.y,6); SFX.pop();
        break;
      }
    }
    if (dead) bullets.splice(i,1);
  }

  /* spawns */
  for (let i=spawnsQ.length-1;i>=0;i--){
    const s = spawnsQ[i];
    if (s.t > 0){ s.t -= dt; continue; }
    s.tele -= dt;
    if (s.tele <= 0){
      const d = E_DEF[s.type];
      enemies.push({type:s.type, x:s.x, y:s.y, vx:0, vy:0,
        hp:d.hp + (s.type==='chaser'? (wave/4|0) : 0),
        flash:0, anim:rand(0,TAU), rise:0.5, cd:rand(1,2.4), strafe:Math.random()<0.5?1:-1});
      addRipple(s.x, s.y, 7);
      spawnsQ.splice(i,1);
    }
  }

  /* enemies */
  for (let i=enemies.length-1;i>=0;i--){
    const e = enemies[i];
    e.anim += dt; e.flash -= dt;
    if (e.rise > 0){ e.rise -= dt; continue; }
    const d = E_DEF[e.type];
    const dx = p.x-e.x, dy = p.y-e.y, dd = Math.hypot(dx,dy)||1;
    let tx = dx/dd, ty = dy/dd;
    let espd = d.spd * (1 + wave*0.02);
    if (e.type === 'sprinter'){
      const s = Math.sin(e.anim*3.2)*0.9*e.strafe;
      const px = -ty, py = tx;
      tx = tx + px*s; ty = ty + py*s;
      const tl = Math.hypot(tx,ty)||1; tx/=tl; ty/=tl;
    } else if (e.type === 'spitter'){
      const want = 270;
      const dir = dd > want+30 ? 1 : (dd < want-30 ? -1 : 0);
      const px = -ty, py = tx;
      tx = tx*dir + px*0.6*e.strafe; ty = ty*dir + py*0.6*e.strafe;
      const tl = Math.hypot(tx,ty)||1; tx/=tl; ty/=tl;
      e.cd -= dt;
      if (e.cd <= 0 && dd < 560){
        e.cd = 2.3;
        const a = Math.atan2(dy,dx);
        orbs.push({x:e.x, y:e.y, vx:Math.cos(a)*150, vy:Math.sin(a)*150, ttl:6, t:0});
        SFX.pop();
      }
    }
    e.vx = lerp(e.vx, tx*espd, 1-Math.pow(0.002,dt));
    e.vy = lerp(e.vy, ty*espd, 1-Math.pow(0.002,dt));
    e.x = clamp(e.x + e.vx*dt, BOUND, ARENA-BOUND);
    e.y = clamp(e.y + e.vy*dt, BOUND, ARENA-BOUND);
    for (let j=i+1;j<enemies.length;j++){
      const o = enemies[j];
      const rr = E_DEF[e.type].r + E_DEF[o.type].r;
      const q = dist2(e.x,e.y,o.x,o.y);
      if (q < rr*rr && q > 1){
        const dq = Math.sqrt(q), push = (rr-dq)/dq*0.5;
        const ox=(e.x-o.x)*push, oy=(e.y-o.y)*push;
        e.x+=ox; e.y+=oy; o.x-=ox; o.y-=oy;
      }
    }
    if (p.iframes <= 0 && dist2(e.x,e.y,p.x,p.y) < (d.r+p.r)*(d.r+p.r)){
      hurtPlayer(d.dmg, e.x, e.y);
    }
  }

  /* orbs */
  for (let i=orbs.length-1;i>=0;i--){
    const o = orbs[i];
    o.x += o.vx*dt; o.y += o.vy*dt; o.ttl -= dt; o.t += dt;
    if (o.ttl<=0 || o.x<BOUND||o.x>ARENA-BOUND||o.y<BOUND||o.y>ARENA-BOUND){ orbs.splice(i,1); continue; }
    if (p.iframes <= 0 && dist2(o.x,o.y,p.x,p.y) < (12+p.r)*(12+p.r)){
      orbs.splice(i,1); hurtPlayer(1, o.x, o.y);
    }
  }

  /* pickups */
  for (let i=pickups.length-1;i>=0;i--){
    const pk = pickups[i];
    pk.t += dt; pk.ttl -= dt;
    if (pk.ttl <= 0){ pickups.splice(i,1); continue; }
    const q = dist2(pk.x,pk.y,p.x,p.y);
    if (q < 90*90){
      const dq = Math.sqrt(q)||1;
      pk.x += (p.x-pk.x)/dq * 240*dt; pk.y += (p.y-pk.y)/dq * 240*dt;
    }
    if (q < 24*24){
      pickups.splice(i,1);
      if (p.hp < p.maxHp){ p.hp++; floatText(p.x,p.y-26,'+♥','#ff8da0'); }
      else { score += 200; floatText(p.x,p.y-26,'+200','#ffe14d'); }
      p.heartBounce = 0.4; SFX.pickup();
      debris(p.x,p.y,PAL.heart,6,0.6);
    }
  }

  updateParts(dt);

  for (let i=floats.length-1;i>=0;i--){ floats[i].ttl -= dt*0.8; if (floats[i].ttl<=0) floats.splice(i,1); }
  comboT -= dt; if (comboT <= 0) combo = 0;
  waveBanner -= dt; dmgFlash -= dt;

  /* wave flow */
  if (enemies.length===0 && spawnsQ.length===0){
    if (waveBreak <= 0){
      if (wave > 0){ const bonus = 250*wave; score += bonus; floatText(p.x, p.y-44, 'WAVE CLEAR +'+bonus, '#35e6ff', true); }
      waveBreak = 2.6;
    }
    waveBreak -= dt;
    if (waveBreak <= 0.0001 && waveBreak > -1){ startWave(wave+1); waveBreak = -2; }
  }

  /* camera */
  const lead = 0.14;
  const targX = p.x + (mouseX - W/2)*lead;
  const targY = p.y + (mouseY - H/2)*lead;
  camX = lerp(camX, targX, 1-Math.pow(0.0001,dt));
  camY = lerp(camY, targY, 1-Math.pow(0.0001,dt));
  camX = clamp(camX, W/2 - 80, ARENA - W/2 + 80);
  camY = clamp(camY, H/2 - 80, ARENA - H/2 + 80);
  shake = Math.max(0, shake - dt*26);
  shakeX = rand(-shake,shake); shakeY = rand(-shake,shake);
}

function updateParts(dt){
  for (let i=parts.length-1;i>=0;i--){
    const q = parts[i];
    q.ttl -= dt;
    if (q.ttl <= 0){ parts.splice(i,1); continue; }
    q.x += q.vx*dt; q.y += q.vy*dt;
    q.vz -= 880*dt; q.z += q.vz*dt;
    q.vx *= Math.pow(0.3, dt); q.vy *= Math.pow(0.3, dt);
    if (q.z < 0){ q.z = 0; q.vz *= -0.45; if (Math.abs(q.vz)<20) q.vz = 0; }
  }
}

function hurtPlayer(dmg, fx, fy){
  const p = player;
  p.hp -= dmg; p.iframes = 1.0; dmgFlash = 0.4; p.heartBounce = 0.5;
  const a = Math.atan2(p.y-fy, p.x-fx);
  p.vx += Math.cos(a)*340; p.vy += Math.sin(a)*340;
  shake = Math.min(shake+11, 18); hitstop = Math.max(hitstop, 0.08);
  combo = 0;
  addRipple(p.x, p.y, 18);
  SFX.hurt();
  debris(p.x, p.y, PAL.ivory, 8, 0.9);
  if (p.hp <= 0){
    state = 'over'; overT = 0; timeScale = 0.25;
    debris(p.x,p.y,PAL.ivory,30,1.6); debris(p.x,p.y,PAL.cyan,18,1.4);
    addLight(p.x,p.y,340,1.6,'#35e6ff',0.6);
    addRipple(p.x,p.y,30);
    SFX.over();
    if (score > best){ best = score; try{ localStorage.setItem('ntdhunter_best', String(best)); }catch(e){} }
  }
}

/* ---------------- render ---------------- */
function render(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const ox = camX - W/2 + shakeX, oy = camY - H/2 + shakeY;

  /* deep space backdrop */
  const bg = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, Math.max(W,H)*0.75);
  bg.addColorStop(0, '#0c0726');
  bg.addColorStop(1, '#03010a');
  ctx.fillStyle = bg;
  ctx.fillRect(0,0,W,H);

  /* reactive neon grid */
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineWidth = 1;
  const gx0 = Math.max(0, Math.floor(ox/GRID)), gx1 = Math.min(ARENA/GRID, Math.ceil((ox+W)/GRID));
  const gy0 = Math.max(0, Math.floor(oy/GRID)), gy1 = Math.min(ARENA/GRID, Math.ceil((oy+H+80)/GRID));
  const hasRipple = ripples.length > 0;
  // horizontal lines
  for (let gy=gy0; gy<=gy1; gy++){
    const major = gy % 4 === 0;
    ctx.strokeStyle = major ? 'rgba(70,180,255,0.20)' : 'rgba(110,70,255,0.11)';
    ctx.beginPath();
    for (let gxn=gx0; gxn<=gx1; gxn++){
      let px = gxn*GRID, py = gy*GRID;
      if (hasRipple){ const [dx,dy] = gridDisp(px,py); px+=dx; py+=dy; }
      if (gxn===gx0) ctx.moveTo(px-ox, py-oy); else ctx.lineTo(px-ox, py-oy);
    }
    ctx.stroke();
  }
  // vertical lines
  for (let gxn=gx0; gxn<=gx1; gxn++){
    const major = gxn % 4 === 0;
    ctx.strokeStyle = major ? 'rgba(70,180,255,0.20)' : 'rgba(110,70,255,0.11)';
    ctx.beginPath();
    for (let gy=gy0; gy<=gy1; gy++){
      let px = gxn*GRID, py = gy*GRID;
      if (hasRipple){ const [dx,dy] = gridDisp(px,py); px+=dx; py+=dy; }
      if (gy===gy0) ctx.moveTo(px-ox, py-oy); else ctx.lineTo(px-ox, py-oy);
    }
    ctx.stroke();
  }

  /* floor lights (additive, stronger now) */
  for (const l of lights){
    const f = l.ttl===undefined ? 1 : clamp(l.ttl/l.max,0,1);
    const g = ctx.createRadialGradient(l.x-ox, l.y-oy, 0, l.x-ox, l.y-oy, l.r);
    const a = 0.42 * l.i * f;
    g.addColorStop(0, colA(l.col, a));
    g.addColorStop(1, colA(l.col, 0));
    ctx.fillStyle = g;
    ctx.fillRect(l.x-ox-l.r, l.y-oy-l.r, l.r*2, l.r*2);
  }
  ctx.globalCompositeOperation = 'source-over';

  /* persistent background logo (watermark, behind the action) */
  drawBrandLogo();

  /* spawn telegraphs */
  for (const s of spawnsQ){
    if (s.t > 0) continue;
    const f = 1 - s.tele/0.75;
    const col = GLOWC[s.type] || '#ff6e96';
    ctx.strokeStyle = colA(col, 0.3+f*0.7);
    ctx.lineWidth = 2 + f*2;
    ctx.beginPath();
    ctx.ellipse(s.x-ox, s.y-oy, 22*(1-f*0.4), 14*(1-f*0.4), 0, 0, TAU);
    ctx.stroke();
  }

  /* shadows (subtle, for voxel depth) */
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  function shadow(x,y,r,z){
    const k = clamp(1 - z/120, 0.25, 1);
    ctx.beginPath(); ctx.ellipse(x-ox, y-oy, r*k, r*0.55*k, 0, 0, TAU); ctx.fill();
  }
  if (player && (state!=='over' || overT < 0.05)) shadow(player.x, player.y+4, 14, 0);
  for (const e of enemies) shadow(e.x, e.y+3, E_DEF[e.type].r+3, 0);
  for (const q of parts) if (q.z < 90) shadow(q.x, q.y+2, q.s*0.8, q.z);
  for (const pk of pickups) shadow(pk.x, pk.y+2, 6, 10);
  for (const o of orbs) shadow(o.x, o.y+2, 7, 12);

  /* perimeter pillars: dark voxels with neon caps */
  const x0 = gx0, x1 = gx1, y0 = gy0, y1 = gy1;
  function queueWall(tx,ty){
    if (tx<0||ty<0||tx>=ARENA/GRID||ty>=ARENA/GRID) return;
    const h = hash2(tx*3+7, ty*5+1);
    const hgt = 24 + h*40;
    const L = lightAt(tx*GRID+GRID/2, ty*GRID+GRID/2);
    qCube(tx*GRID+3, ty*GRID+3, 0, GRID-7, GRID-7, hgt, PAL.wall, L);
    const cap = h > 0.5 ? PAL.cyan : PAL.orb;
    qCube(tx*GRID+GRID*0.22, ty*GRID+GRID*0.22, hgt, GRID*0.56, GRID*0.56, 5, cap, L, 0.55 + Math.sin(elapsed*2 + h*9)*0.2);
  }
  for (let tx=x0-1; tx<=x1; tx++){
    for (const tyW of [0, (ARENA/GRID)-1]){
      if (tyW < y0-2 || tyW > y1+2) continue;
      queueWall(tx, tyW);
    }
  }
  for (let ty=y0-1; ty<=y1; ty++){
    for (const txW of [0, (ARENA/GRID)-1]){
      if (txW < x0-2 || txW > x1+2) continue;
      queueWall(txW, ty);
    }
  }

  if (player && state!=='over') drawShip(player);
  for (const e of enemies) drawEnemy(e);
  for (const pk of pickups) drawPickup(pk);
  for (const q of parts){
    const f = clamp(q.ttl/q.max,0,1);
    qCube(q.x-q.s/2, q.y-q.s/2, q.z, q.s, q.s, q.s, q.rgb, 1, 0.35 + (1-f)*0.1);
  }
  for (const b of bullets) qCube(b.x-3.5, b.y-3, 9, 7,6,6, PAL.gold, 1.2, 0.9);
  for (const o of orbs){
    const pz = 11 + Math.sin(o.t*9)*3;
    qCube(o.x-5, o.y-4.5, pz, 10,9,9, PAL.orb, 1.1, 0.8);
  }
  for (const d of dust){
    if (d.x<ox-20||d.x>ox+W+20||d.y<oy-20||d.y>oy+H+20) continue;
    const tw = 0.4 + 0.6*Math.abs(Math.sin(d.tw));
    qCube(d.x, d.y, d.z + Math.sin(d.tw*0.7)*8, d.s, d.s, d.s, hex(d.c), 0.5, tw*0.35);
  }

  if (state==='menu') queueTitle();
  renderQ(ox,oy);

  /* ---- neon bloom pass (additive) ---- */
  ctx.globalCompositeOperation = 'lighter';
  // bullet streaks
  ctx.lineCap = 'round';
  for (const b of bullets){
    const bx = b.x-ox, by = b.y-oy-9;
    ctx.strokeStyle = 'rgba(255,225,77,0.85)';
    ctx.lineWidth = 3.5;
    ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(bx - b.vx*0.035, by - b.vy*0.035); ctx.stroke();
    glow(bx, by, 20, '#ffe14d', 0.55);
  }
  // enemy halos
  for (const e of enemies){
    const r = (E_DEF[e.type].r + 8) * 2.6;
    const a = 0.20 + (e.flash>0?0.45:0) + (e.rise>0? e.rise*0.5 : 0);
    glow(e.x-ox, e.y-oy-8, r, GLOWC[e.type], a);
  }
  // orbs
  for (const o of orbs) glow(o.x-ox, o.y-oy-12, 24, '#ff4dd2', 0.6);
  // pickups
  for (const pk of pickups) glow(pk.x-ox, pk.y-oy-12, 22, '#ff4d6e', 0.4);
  // ship aura + engine
  if (player && (state==='playing' || (state==='over' && overT<0.05))){
    const p = player;
    glow(p.x-ox, p.y-oy-8, 42, '#35e6ff', 0.30);
    const ea = p.aim + Math.PI;
    const ex = p.x + Math.cos(ea)*15, ey = p.y + Math.sin(ea)*15;
    const thr = clamp(Math.hypot(p.vx,p.vy)/250,0.15,1);
    glow(ex-ox, ey-oy-6, 14+thr*12, '#ff7a2e', 0.5*thr+0.12);
  }
  // engine exhaust trail
  for (const j of jets){
    const f = clamp(j.ttl/j.max,0,1);
    glow(j.x-ox, j.y-oy-6, 5+10*f, '#35e6ff', 0.4*f);
  }
  // debris sparkle
  for (const q of parts){
    const f = clamp(q.ttl/q.max,0,1);
    if (f > 0.4) glow(q.x-ox, q.y-oy-q.z, q.s*2.4, q.rgb, 0.22*f);
  }
  ctx.globalCompositeOperation = 'source-over';

  /* floating texts */
  ctx.textAlign = 'center';
  for (const f of floats){
    const a = clamp(f.ttl,0,1);
    ctx.globalAlpha = a;
    ctx.font = (f.big? '800 26px':'700 17px') + ' ui-monospace, Menlo, Consolas, monospace';
    ctx.fillStyle = '#04020d';
    ctx.fillText(f.txt, f.x-ox+2, f.y-oy - (1-a)*44 + 2);
    ctx.fillStyle = f.col;
    ctx.fillText(f.txt, f.x-ox, f.y-oy - (1-a)*44);
  }
  ctx.globalAlpha = 1;

  /* vignette */
  const vg = ctx.createRadialGradient(W/2,H/2, Math.min(W,H)*0.36, W/2,H/2, Math.max(W,H)*0.74);
  vg.addColorStop(0,'rgba(0,0,0,0)');
  vg.addColorStop(1,'rgba(2,0,10,0.6)');
  ctx.fillStyle = vg; ctx.fillRect(0,0,W,H);

  if (dmgFlash > 0){
    ctx.fillStyle = 'rgba(255,40,90,'+(dmgFlash*0.45)+')';
    ctx.fillRect(0,0,W,H);
  }

  drawHUD();

  /* crosshair */
  if (state==='playing'){
    ctx.save();
    ctx.translate(mouseX, mouseY);
    ctx.rotate(Math.PI/4);
    ctx.strokeStyle = 'rgba(53,230,255,0.95)';
    ctx.shadowColor = '#35e6ff'; ctx.shadowBlur = 8;
    ctx.lineWidth = 2;
    const cd = clamp(player.fireCd/0.115,0,1);
    const r = 7 + cd*4;
    ctx.strokeRect(-r,-r,r*2,r*2);
    ctx.fillStyle = 'rgba(53,230,255,0.9)';
    ctx.fillRect(-1.5,-1.5,3,3);
    ctx.restore();
  }
}
function rgbToHex(rgb){
  return '#' + rgb.map(v=>clamp(v,0,255).toString(16).padStart(2,'0')).join('');
}
function glow(x,y,r,col,a){
  const g = ctx.createRadialGradient(x,y,0,x,y,r);
  g.addColorStop(0, colA(col,a));
  g.addColorStop(1, colA(col,0));
  ctx.fillStyle = g;
  ctx.fillRect(x-r,y-r,r*2,r*2);
}
function colA(c, a){
  const v = typeof c === 'string' ? hex(c) : c;
  return 'rgba('+v[0]+','+v[1]+','+v[2]+','+a+')';
}

/* ---------------- background brand logo ---------------- */
function drawBrandLogo(){
  const mono = ' ui-monospace, Menlo, Consolas, monospace';
  const scale = clamp(W / 1200, 0.55, 1);
  const cx = W/2;
  const topY = clamp(H*0.075, 38, 74);
  const pulse = 0.5 + 0.5*Math.sin(elapsed*1.5);

  ctx.save();
  ctx.textAlign = 'center';

  /* Sightsavers eye motif */
  ctx.globalCompositeOperation = 'lighter';
  const ew = 30*scale, eh = 13*scale;
  ctx.strokeStyle = colA('#35e6ff', 0.16 + pulse*0.10);
  ctx.lineWidth = 2*scale;
  ctx.beginPath();
  ctx.moveTo(cx-ew, topY);
  ctx.quadraticCurveTo(cx, topY-eh, cx+ew, topY);
  ctx.quadraticCurveTo(cx, topY+eh, cx-ew, topY);
  ctx.closePath();
  ctx.stroke();
  glow(cx, topY, 11*scale, '#35e6ff', 0.20 + pulse*0.12);
  ctx.fillStyle = colA('#aef0ff', 0.55);
  ctx.beginPath(); ctx.arc(cx, topY, 4*scale, 0, TAU); ctx.fill();
  ctx.globalCompositeOperation = 'source-over';

  /* eyebrow */
  ctx.font = '700 ' + (12*scale).toFixed(1) + 'px' + mono;
  if ('letterSpacing' in ctx) ctx.letterSpacing = (7*scale).toFixed(1) + 'px';
  ctx.fillStyle = colA('#35e6ff', 0.46);
  ctx.fillText('SIGHTSAVERS', cx + 3.5*scale, topY + 30*scale);
  if ('letterSpacing' in ctx) ctx.letterSpacing = '0px';

  /* wordmark — faint so the action reads on top of it */
  const wy = topY + 70*scale;
  ctx.font = '900 ' + (46*scale).toFixed(1) + 'px' + mono;
  const grad = ctx.createLinearGradient(cx-200*scale, 0, cx+200*scale, 0);
  grad.addColorStop(0, '#35e6ff'); grad.addColorStop(0.5, '#f4f8ff'); grad.addColorStop(1, '#ff4dd2');
  ctx.globalAlpha = state === 'menu' ? 0.12 : 0.20;
  ctx.shadowColor = '#35e6ff'; ctx.shadowBlur = 16*scale;
  ctx.fillStyle = grad;
  ctx.fillText('NTD HUNTER', cx, wy);
  ctx.shadowBlur = 0; ctx.globalAlpha = 1;
  ctx.restore();
}

/* ---------------- voxel title ---------------- */
const FONT = {
  A:["01110","10001","11111","10001","10001"],
  D:["11110","10001","10001","10001","11110"],
  H:["10001","10001","11111","10001","10001"],
  N:["10001","11001","10101","10011","10001"],
  U:["10001","10001","10001","10001","01110"],
  L:["10000","10000","10000","10000","11111"],
  W:["10001","10001","10101","10101","01010"],
  V:["10001","10001","10001","01010","00100"],
  O:["01110","10001","10001","10001","01110"],
  X:["10001","01010","00100","01010","10001"],
  S:["01111","10000","01110","00001","11110"],
  T:["11111","00100","00100","00100","00100"],
  R:["11110","10001","11110","10010","10001"],
  I:["11111","00100","00100","00100","11111"],
  K:["10001","10010","11100","10010","10001"],
  E:["11111","10000","11100","10000","11111"],
};
function queueTitle(){
  const word = "NTD HUNTER";
  const scale = clamp(W / 1180, 0.62, 1);
  const s = 12 * scale, gap = s*6.4, space = gap*0.55;
  // measure true width (spaces are narrower)
  let totalW = 0; for (let i=0;i<word.length;i++) totalW += (word[i]===' '? space : gap);
  totalW -= (gap - (s*1.4));
  const by = camY - 64;
  let cx = camX - totalW/2;
  for (let i=0;i<word.length;i++){
    if (word[i] === ' '){ cx += space; continue; }
    const g = FONT[word[i]];
    if (g){
      const bob = Math.sin(elapsed*1.6 + i*0.55)*6;
      const sweep = (Math.sin(elapsed*0.9 - i*0.45)+1)/2;
      const rgb = i%2===0 ? PAL.cyan : PAL.orb;
      for (let r=0;r<5;r++) for (let c=0;c<5;c++){
        if (g[r][c]!=='1') continue;
        qCube(cx + c*s, by, (4-r)*s + 24 + bob, s-1.5, s*0.8, s-1.5, rgb, 1.0 + sweep*0.3, 0.3 + sweep*0.35);
      }
    }
    cx += gap;
  }
  addLight(camX, by+40, 460, 0.6, '#7a4dff', 0.05);
}

/* ---------------- HUD ---------------- */
function drawHUD(){
  const mono = ' ui-monospace, Menlo, Consolas, monospace';
  if (state === 'playing' || state === 'over'){
    const p = player;
    const bounce = p.heartBounce > 0 ? Math.sin(p.heartBounce*20)*3 : 0;
    for (let i=0;i<p.maxHp;i++){
      const x = 26 + i*30, y = 30 + (i < p.hp ? bounce : 0);
      drawHeart(x, y, 9, i < p.hp ? '#ff4d6e' : 'rgba(255,255,255,0.12)');
    }
    ctx.textAlign = 'right';
    ctx.font = '800 30px' + mono;
    ctx.fillStyle = '#04020d'; ctx.fillText(fmt(score), W-24+2, 44+2);
    ctx.fillStyle = '#f4f8ff'; ctx.fillText(fmt(score), W-24, 44);
    ctx.font = '700 13px' + mono;
    ctx.fillStyle = 'rgba(180,200,255,0.55)';
    ctx.fillText('BEST ' + fmt(best), W-24, 64);
    if (combo > 1){
      const mult = (1 + Math.min(combo,30)*0.1).toFixed(1);
      ctx.fillStyle = '#ffe14d';
      ctx.font = '800 19px' + mono;
      ctx.fillText('×' + mult + '  ' + combo + ' CHAIN', W-24, 92);
      ctx.fillStyle = 'rgba(255,225,77,0.3)';
      ctx.fillRect(W-24-120, 100, 120, 4);
      ctx.fillStyle = '#ffe14d';
      ctx.fillRect(W-24-120*clamp(comboT/2.2,0,1), 100, 120*clamp(comboT/2.2,0,1), 4);
    }
    ctx.textAlign = 'left';
    ctx.font = '700 14px' + mono;
    ctx.fillStyle = 'rgba(180,200,255,0.6)';
    ctx.fillText('WAVE ' + wave + '   VECTORS ' + (enemies.length + spawnsQ.length), 26, 70);
    const cd = clamp(1 - player.dashCd/1.15, 0, 1);
    ctx.fillStyle = 'rgba(53,230,255,0.22)';
    ctx.fillRect(26, 82, 90, 5);
    ctx.fillStyle = cd >= 1 ? '#35e6ff' : 'rgba(53,230,255,0.6)';
    ctx.fillRect(26, 82, 90*cd, 5);
    ctx.fillStyle = 'rgba(180,200,255,0.45)';
    ctx.font = '700 11px' + mono;
    ctx.fillText('DASH', 122, 88);
  }
  if (waveBanner > 0 && state==='playing'){
    const a = clamp(Math.min(waveBanner, 2.4-waveBanner)*2, 0, 1);
    ctx.globalAlpha = a;
    ctx.textAlign = 'center';
    ctx.font = '900 44px' + mono;
    ctx.fillStyle = '#04020d'; ctx.fillText('WAVE ' + wave, W/2+3, H*0.2+3);
    ctx.fillStyle = '#35e6ff'; ctx.fillText('WAVE ' + wave, W/2, H*0.2);
    ctx.globalAlpha = 1;
  }
  if (paused){
    ctx.fillStyle = 'rgba(3,1,12,0.6)'; ctx.fillRect(0,0,W,H);
    ctx.textAlign='center'; ctx.fillStyle='#f4f8ff';
    ctx.font = '900 40px' + mono; ctx.fillText('PAUSED', W/2, H/2);
    ctx.font = '700 15px' + mono; ctx.fillStyle='rgba(180,200,255,0.6)';
    ctx.fillText('P to resume · M sound', W/2, H/2+34);
  }
  if (state === 'menu'){
    ctx.textAlign = 'center';
    const pulse = 0.55 + 0.45*Math.sin(elapsed*2.4);
    ctx.font = '800 15px' + mono;
    ctx.fillStyle = 'rgba(255,77,210,0.85)';
    ctx.fillText('— ELIMINATION PROTOCOL —', W/2, H/2 + 52);
    ctx.font = '700 16px' + mono;
    ctx.fillStyle = 'rgba(220,232,255,0.75)';
    ctx.fillText('WASD move · mouse aim · hold click to fire · SPACE dash', W/2, H/2 + 86);
    ctx.font = '800 22px' + mono;
    ctx.fillStyle = 'rgba(53,230,255,' + (0.4+pulse*0.6) + ')';
    ctx.fillText('CLICK TO DEPLOY', W/2, H/2 + 132);
    ctx.font = '700 12px' + mono;
    ctx.fillStyle = 'rgba(180,200,255,0.4)';
    ctx.fillText('survive the waves · chain kills for multipliers · M mute', W/2, H/2 + 160);
  }
  if (state === 'over' && overT > 0.7){
    const a = clamp((overT-0.7)/0.6, 0, 1);
    ctx.globalAlpha = a;
    ctx.fillStyle = 'rgba(3,1,12,0.62)'; ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';
    ctx.font = '900 52px' + mono;
    ctx.fillStyle = '#04020d'; ctx.fillText('HUNTER DOWN', W/2+3, H*0.38+3);
    ctx.fillStyle = '#ff4dd2'; ctx.fillText('HUNTER DOWN', W/2, H*0.38);
    ctx.font = '800 26px' + mono; ctx.fillStyle = '#f4f8ff';
    ctx.fillText(fmt(score) + ' pts', W/2, H*0.38 + 52);
    ctx.font = '700 16px' + mono; ctx.fillStyle = 'rgba(220,232,255,0.7)';
    ctx.fillText('wave ' + wave + ' · ' + kills + ' kills' + (score>=best && score>0 ? ' · NEW BEST' : ' · best ' + fmt(best)), W/2, H*0.38 + 84);
    // real-world call to action
    ctx.font = '800 17px' + mono;
    ctx.fillStyle = 'rgba(53,230,255,0.95)';
    const url = 'Go to Sightsavers.org';
    ctx.fillText(url, W/2, H*0.38 + 126);
    const uw = ctx.measureText(url).width;
    ctx.fillRect(W/2 - uw/2, H*0.38 + 132, uw, 1.5);   // underline (link cue)
    ctx.font = '700 14px' + mono; ctx.fillStyle = 'rgba(220,232,255,0.72)';
    ctx.fillText('to help us continue the fight against NTDs', W/2, H*0.38 + 152);
    ctx.fillText('in endemic countries around the world', W/2, H*0.38 + 172);
    if (overT > 1.2){
      const pulse = 0.5 + 0.5*Math.sin(elapsed*3);
      ctx.fillStyle = 'rgba(53,230,255,' + (0.4+pulse*0.6) + ')';
      ctx.font = '800 19px' + mono;
      ctx.fillText('CLICK or R to redeploy', W/2, H*0.38 + 210);
    }
    ctx.globalAlpha = 1;
  }
}
function drawHeart(x,y,s,col){
  ctx.fillStyle = col;
  ctx.fillRect(x - s, y - s*0.6, s*0.85, s*0.85);
  ctx.fillRect(x + s*0.15, y - s*0.6, s*0.85, s*0.85);
  ctx.fillRect(x - s*0.5, y + 0.25*s, s, s*0.8);
  ctx.fillRect(x - s*0.75, y - s*0.1, s*1.5, s*0.6);
}
function fmt(n){ return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }

/* ---------------- main loop ---------------- */
let last = performance.now();
function frame(now){
  requestAnimationFrame(frame);
  // self-heal: if the embed reported 0 size at boot, re-measure once it settles
  const vw = window.innerWidth || (document.documentElement && document.documentElement.clientWidth) || 0;
  if (!W || !H || (vw && Math.abs(vw - W) > 1)) resize();
  let dt = Math.min((now - last)/1000, 0.033);
  last = now;
  if (state==='over') timeScale = lerp(timeScale, 1, dt*1.4);
  if (hitstop > 0){ hitstop -= dt; dt = 0; }
  if (!paused) update(dt * timeScale);
  render();
}
requestAnimationFrame(frame);

setInterval(()=>{
  if (state==='menu'){
    camX = ARENA/2 + Math.sin(elapsed*0.21)*60;
    camY = ARENA/2 + Math.cos(elapsed*0.17)*40;
    if (Math.random() < 0.02) addRipple(ARENA/2 + rand(-300,300), ARENA/2 + rand(-200,200), rand(6,14));
  }
}, 16);
</script>
